<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史星链探索 | History Starlink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">◇</span>
        <h1>历史星链探索</h1>
      </div>
      <nav class="filter-nav">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="china">东方</button>
        <button class="filter-btn" data-filter="foreign">西方</button>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Chart View -->
      <section id="chart-view" class="view active">
        <div id="history-chart3d" class="chart3d-container"></div>
      </section>

      <!-- Starlink View -->
      <section id="starlink-view" class="view">
        <div class="starlink-header">
          <button id="back-btn" class="back-btn">
            <span>←</span> 返回
          </button>
          <div class="starlink-header-right">
            <div class="ring-legend" aria-label="星链节点外圈颜色说明">
              <span class="ring-legend-item">
                <span class="ring-dot ring-dot-east" aria-hidden="true"></span>
                红色外圈-东方
              </span>
              <span class="ring-legend-item">
                <span class="ring-dot ring-dot-west" aria-hidden="true"></span>
                黄色外圈-西方
              </span>
            </div>
            <div id="breadcrumb" class="breadcrumb"></div>
          </div>
        </div>
        <div class="starlink-container">
          <svg id="starlink-svg" class="starlink-svg"></svg>
          <div id="event-detail" class="event-detail hidden"></div>
        </div>
      </section>
    </main>

    <!-- Scanlines -->
    <div class="scanlines"></div>
  </div>

  <script src="scripts/data.js"></script>
  <script src="scripts/chart3d.js"></script>
  <script src="scripts/starlink.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
