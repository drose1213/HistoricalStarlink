[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    unit: 单元测试
    e2e: 黑盒/端到端测试
    slow: 慢速测试
filterwarnings =
    ignore::DeprecationWarning
